    *, *::before, *::after {

    /* Hexagonal lattice background */

      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .hex-lattice svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120vmax;
      height: 120vmax;
    }

    .hex-cell {
      fill: none;
      stroke: var(--steel);
      stroke-width: 1;
      opacity: 0.04;
      transition: opacity 0.3s ease;
    }

    .hex-cell.center {
      opacity: 0.08;
      stroke: var(--hex-blue);
      stroke-width: 1.2;
    }

    .hex-junction {
      fill: var(--hex-blue);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .hex-junction.visible {
      opacity: 0.2;
    }

    .hex-path {
      fill: none;
      stroke: url(#pathGradient);
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: 0;
      transition: opacity 0.8s ease;

  <script>
    // Generate hexagonal lattice
    (function() {
      const grid = document.getElementById('hexGrid');
      const hexSize = 40;
      const rows = 12;
      const cols = 16;
      const centerX = 0;
      const centerY = 0;

      function hexPoints(cx, cy, size) {
        const points = [];
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 180) * (60 * i - 30);
          points.push([
            cx + size * Math.cos(angle),
            cy + size * Math.sin(angle)
          ]);
        }
        return points.map(p => p.join(',')).join(' ');
      }

      function distance(x1, y1, x2, y2) {
        return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
      }

      const hexagons = [];

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = (col - cols / 2) * hexSize * 1.75 + (row % 2 ? hexSize * 0.875 : 0);
          const y = (row - rows / 2) * hexSize * 1.5;

          const dist = distance(x, y, centerX, centerY);
          const maxDist = 350;

          if (dist < maxDist) {
            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            polygon.setAttribute('points', hexPoints(x, y, hexSize));
            polygon.setAttribute('class', 'hex-cell' + (dist < 120 ? ' center' : ''));
            grid.appendChild(polygon);
            hexagons.push({ el: polygon, x, y, dist });

            // Add junction dots at vertices
            if (dist < 250 && Math.random() > 0.6) {
              const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
              dot.setAttribute('cx', x);
              dot.setAttribute('cy', y);
              dot.setAttribute('r', '2.5');
              dot.setAttribute('class', 'hex-junction');
              grid.appendChild(dot);

              setTimeout(() => {
                dot.classList.add('visible');
              }, 800 + dist * 1.5);
            }
          }
        }
      }

      // Add accent paths
      const paths = [
        { d: 'M -160,80 L -80,40 L 0,0 L 80,-40 L 160,-80', delay: 1200 },
        { d: 'M -120,-120 L -60,-60 L 0,0 L 60,60 L 120,120', delay: 1400 },
      ];

      paths.forEach(({ d, delay }) => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', 'hex-path');
        grid.appendChild(path);

        setTimeout(() => {
          path.classList.add('visible');
        }, delay);
      });
    })();
  </script>
