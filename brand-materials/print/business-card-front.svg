<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 196" width="340" height="196">
  <defs>
    <linearGradient id="hexBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeLatticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9D1D9;stop-opacity:1" />
    </linearGradient>
    <clipPath id="cardClip"><rect width="340" height="196" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="340" height="196" fill="#0D1117"/>

    <!-- Subtle hexagonal pattern -->
    <g opacity="0.04" stroke="#00A8E8" stroke-width="0.3" fill="none">
      <polygon points="280,10 310,30 310,60 280,80 250,60 250,30"/>
      <polygon points="280,50 310,70 310,100 280,120 250,100 250,70"/>
      <polygon points="310,30 340,50 340,80 310,100 280,80 280,50"/>
    </g>

    <!-- Top accent line -->
    <rect x="0" y="0" width="340" height="2" fill="url(#hexBlueGrad)"/>

    <!-- Logo -->
    <g transform="translate(24, 28) scale(0.28)">
      <g transform="translate(40, 40)">
        <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="url(#hexBlueGrad)" opacity="0.9"/>
        <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#0D1117" opacity="0.55"/>
        <path d="M -8,8 L 0,0 L 8,-8 L 10,-10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polygon points="10,-10 6,-10 10,-6" fill="white"/>
      </g>
      <text x="82" y="38" font-family="'Inter', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="1">OMN</text>
      <text x="138" y="38" font-family="'Inter', Arial, sans-serif" font-size="24" font-weight="300" fill="#00A8E8">yra</text>
      <text x="82" y="56" font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="500" fill="#8B949E" letter-spacing="4">GROUP</text>
    </g>

    <!-- Name -->
    <text x="24" y="110" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">[Full Name]</text>

    <!-- Title -->
    <text x="24" y="126" font-family="'Inter', Arial, sans-serif" font-size="9" font-weight="400" fill="#00A8E8" letter-spacing="0.5">[Title] — GRC Advisory</text>

    <!-- Domain badge -->
    <rect x="24" y="138" width="28" height="14" rx="3" fill="#00A8E8" opacity="0.15"/>
    <text x="38" y="148" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="7" font-weight="600" fill="#00A8E8" letter-spacing="0.5">GRC</text>

    <!-- Contact details -->
    <text x="24" y="172" font-family="'Inter', Arial, sans-serif" font-size="7.5" font-weight="300" fill="#8B949E" letter-spacing="0.3">omnyra.training@gmail.com</text>
    <text x="24" y="184" font-family="'Inter', Arial, sans-serif" font-size="7.5" font-weight="300" fill="#8B949E" letter-spacing="0.3">+91 9063370816 | WhatsApp</text>

    <!-- Tagline bottom right -->
    <text x="316" y="188" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="6" font-weight="300" fill="#8B949E" letter-spacing="1.5" opacity="0.6">STRUCTURE IN MOTION</text>
  </g>
</svg>
