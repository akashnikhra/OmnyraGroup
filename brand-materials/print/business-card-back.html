<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMNyra Group — Business Card Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Inter', Arial, sans-serif;
  }
  .card {
    width: 640px;
    height: 376px;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .card svg {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div class="card">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" width="640" height="376" role="img" aria-label="OMNyra Group business card back">
  <title>OMNyra Group Business Card Back</title>
  <defs>
    <linearGradient id="hexBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeLatticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9D1D9;stop-opacity:1" />
    </linearGradient>
    <clipPath id="cardClip"><rect width="640" height="376" rx="15"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="640" height="376" fill="#0D1117"/>

    <!-- Full hexagonal lattice pattern -->
    <g opacity="0.04" stroke="#00A8E8" stroke-width="0.6" fill="none">
      <!-- Row 1 -->
      <polygon points="113,57 151,34 189,57 189,103 151,126 113,103"/>
      <polygon points="226,57 264,34 302,57 302,103 264,126 226,103"/>
      <polygon points="339,57 377,34 415,57 415,103 377,126 339,103"/>
      <polygon points="452,57 490,34 528,57 528,103 490,126 452,103"/>
      <polygon points="565,57 603,34 641,57 641,103 603,126 565,103"/>
      <!-- Row 2 -->
      <polygon points="57,113 95,90 133,113 133,159 95,182 57,159"/>
      <polygon points="170,113 208,90 246,113 246,159 208,182 170,159"/>
      <polygon points="283,113 321,90 359,113 359,159 321,182 283,159"/>
      <polygon points="396,113 434,90 472,113 472,159 434,182 396,159"/>
      <polygon points="509,113 547,90 585,113 585,159 547,182 509,159"/>
      <!-- Row 3 -->
      <polygon points="113,169 151,146 189,169 189,215 151,238 113,215"/>
      <polygon points="226,169 264,146 302,169 302,215 264,238 226,215"/>
      <polygon points="339,169 377,146 415,169 415,215 377,238 339,215"/>
      <polygon points="452,169 490,146 528,169 528,215 490,238 452,215"/>
      <polygon points="565,169 603,146 641,169 641,215 603,238 565,215"/>
      <!-- Row 4 -->
      <polygon points="57,225 95,202 133,225 133,271 95,294 57,271"/>
      <polygon points="170,225 208,202 246,225 246,271 208,294 170,271"/>
      <polygon points="283,225 321,202 359,225 359,271 321,294 283,271"/>
      <polygon points="396,225 434,202 472,225 472,271 434,294 396,271"/>
      <polygon points="509,225 547,202 585,225 585,271 547,294 509,271"/>
      <!-- Row 5 -->
      <polygon points="113,281 151,258 189,281 189,327 151,350 113,327"/>
      <polygon points="226,281 264,258 302,281 302,327 264,350 226,327"/>
      <polygon points="339,281 377,258 415,281 415,327 377,350 339,327"/>
      <polygon points="452,281 490,258 528,281 528,327 490,350 452,327"/>
      <polygon points="565,281 603,258 641,281 641,327 603,350 565,327"/>
    </g>

    <!-- Centered large Sentinel Mark emblem -->
    <g transform="translate(320, 168) scale(1.32)">
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="url(#hexBlueGrad)" opacity="0.15"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#0D1117" opacity="0.5"/>
      <path d="M -14,14 L 0,0 L 14,-14 L 18,-18" stroke="#00A8E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polygon points="18,-18 12,-18 18,-12" fill="#00A8E8"/>
      <!-- Junction nodes -->
      <circle cx="0" cy="-40" r="3.5" fill="#C9D1D9"/>
      <circle cx="35" cy="-20" r="3.5" fill="#C9D1D9"/>
      <circle cx="35" cy="20" r="3.5" fill="#C9D1D9"/>
      <circle cx="0" cy="40" r="3.5" fill="#C9D1D9"/>
      <circle cx="-35" cy="20" r="3.5" fill="#C9D1D9"/>
      <circle cx="-35" cy="-20" r="3.5" fill="#C9D1D9"/>
    </g>

    <!-- Tagline -->
    <text x="320" y="300" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="500" fill="#8B949E" letter-spacing="8" opacity="0.7">STRUCTURE IN MOTION</text>

    <!-- Website -->
    <text x="320" y="335" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="300" fill="#8B949E" letter-spacing="2" opacity="0.5">www.omnyragroup.online</text>

    <!-- Bottom accent -->
    <rect x="0" y="372" width="640" height="4" fill="url(#hexBlueGrad)"/>
  </g>
</svg>
</div>
</body>
</html>
