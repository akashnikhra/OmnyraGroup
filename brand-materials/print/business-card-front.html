<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMNyra Group — Business Card Front</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Inter', Arial, sans-serif;
  }
  .card {
    width: 640px;
    height: 376px;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .card svg {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div class="card">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" width="640" height="376" role="img" aria-label="OMNyra Group business card front">
  <title>OMNyra Group Business Card Front</title>
  <defs>
    <linearGradient id="hexBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeLatticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9D1D9;stop-opacity:1" />
    </linearGradient>
    <clipPath id="cardClip"><rect width="640" height="376" rx="15"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="640" height="376" fill="#0D1117"/>

    <!-- Subtle hexagonal pattern — top-right area -->
    <g opacity="0.04" stroke="#00A8E8" stroke-width="0.6" fill="none">
      <polygon points="528,19 585,57 585,113 528,151 471,113 471,57"/>
      <polygon points="528,95 585,133 585,189 528,227 471,189 471,133"/>
      <polygon points="585,57 642,95 642,151 585,189 528,151 528,95"/>
    </g>

    <!-- Top accent line -->
    <rect x="0" y="0" width="640" height="4" fill="url(#hexBlueGrad)"/>

    <!-- Logo: hexagonal sentinel mark -->
    <g transform="translate(45, 53) scale(0.53)">
      <g transform="translate(40, 40)">
        <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="url(#hexBlueGrad)" opacity="0.9"/>
        <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#0D1117" opacity="0.55"/>
        <path d="M -8,8 L 0,0 L 8,-8 L 10,-10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polygon points="10,-10 6,-10 10,-6" fill="white"/>
      </g>
    </g>

    <!-- Logo wordmark -->
    <text x="82" y="72" font-family="'Inter', Arial, sans-serif" font-size="45" font-weight="800" fill="#FFFFFF" letter-spacing="1.8">OMN</text>
    <text x="194" y="72" font-family="'Inter', Arial, sans-serif" font-size="45" font-weight="300" fill="#00A8E8">yra</text>
    <text x="82" y="105" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="500" fill="#8B949E" letter-spacing="7.5">GROUP</text>

    <!-- Name -->
    <text x="45" y="208" font-family="'Inter', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="0.9">[Full Name]</text>

    <!-- Title -->
    <text x="45" y="238" font-family="'Inter', Arial, sans-serif" font-size="17" font-weight="400" fill="#00A8E8" letter-spacing="0.9">[Title] — GRC Advisory</text>

    <!-- GRC Badge -->
    <rect x="45" y="257" width="53" height="26" rx="6" fill="#00A8E8" opacity="0.15"/>
    <text x="71" y="274" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="600" fill="#00A8E8" letter-spacing="0.9">GRC</text>

    <!-- Contact details -->
    <text x="45" y="324" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="300" fill="#8B949E" letter-spacing="0.5">[Email]</text>
    <text x="45" y="347" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="300" fill="#8B949E" letter-spacing="0.5">[Phone]</text>

    <!-- Tagline bottom right -->
    <text x="595" y="355" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="300" fill="#8B949E" letter-spacing="2.8" opacity="0.6">STRUCTURE IN MOTION</text>
  </g>
</svg>
</div>
</body>
</html>
