<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hexBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeLatticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9D1D9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sqClip"><rect width="1080" height="1080"/></clipPath>
  </defs>

  <g clip-path="url(#sqClip)">
    <!-- Background -->
    <rect width="1080" height="1080" fill="url(#bgGrad)"/>

    <!-- Hexagonal lattice pattern -->
    <g opacity="0.04" stroke="#00A8E8" stroke-width="0.5" fill="none">
      <polygon points="850,50 880,30 910,50 910,90 880,110 850,90"/>
      <polygon points="910,50 940,30 970,50 970,90 940,110 910,90"/>
      <polygon points="970,50 1000,30 1030,50 1030,90 1000,110 970,90"/>
      <polygon points="850,110 880,90 910,110 910,150 880,170 850,150"/>
      <polygon points="910,110 940,90 970,110 970,150 940,170 910,150"/>
      <polygon points="970,110 1000,90 1030,110 1030,150 1000,170 970,150"/>
    </g>

    <!-- Top accent line -->
    <rect x="0" y="0" width="1080" height="4" fill="url(#hexBlueGrad)"/>

    <!-- Logo top-left -->
    <g transform="translate(60, 50) scale(0.5)">
      <g transform="translate(40, 40)">
        <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="3.5" stroke-linejoin="round"/>
        <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="url(#hexBlueGrad)" opacity="0.9"/>
        <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="#0D1117" opacity="0.55"/>
        <path d="M -8,8 L 0,0 L 8,-8 L 10,-10" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polygon points="10,-10 6,-10 10,-6" fill="white"/>
      </g>
      <text x="86" y="38" font-family="'Inter', Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="1">OMN</text>
      <text x="146" y="38" font-family="'Inter', Arial, sans-serif" font-size="26" font-weight="300" fill="#00A8E8">yra</text>
      <text x="86" y="56" font-family="'Inter', Arial, sans-serif" font-size="8.5" font-weight="500" fill="#8B949E" letter-spacing="4.5">GROUP</text>
    </g>

    <!-- Domain badge -->
    <rect x="60" y="140" width="50" height="24" rx="4" fill="#00A8E8" opacity="0.15"/>
    <text x="85" y="156" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="600" fill="#00A8E8" letter-spacing="1">GRC</text>

    <!-- Main headline -->
    <text x="60" y="360" font-family="'Inter', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">FROM THEORY</text>
    <text x="60" y="440" font-family="'Inter', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">TO GRC</text>
    <text x="60" y="520" font-family="'Inter', Arial, sans-serif" font-size="72" font-weight="300" fill="#00A8E8" letter-spacing="-1">MASTERY</text>

    <!-- Divider -->
    <line x1="60" y1="560" x2="300" y2="560" stroke="#00A8E8" stroke-width="2" opacity="0.5"/>

    <!-- Subtext -->
    <text x="60" y="610" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#8B949E" letter-spacing="0.5">Practitioner-led GRC training.</text>
    <text x="60" y="645" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#8B949E" letter-spacing="0.5">Career strategy coaching.</text>
    <text x="60" y="680" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#8B949E" letter-spacing="0.5">Real-world readiness.</text>

    <!-- Stats row -->
    <g transform="translate(60, 760)">
      <text x="0" y="0" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" fill="#00A8E8">95%</text>
      <text x="0" y="24" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B949E" letter-spacing="1">PLACEMENT RATE</text>

      <text x="240" y="0" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" fill="#00A8E8">4+</text>
      <text x="240" y="24" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B949E" letter-spacing="1">GRC DOMAINS</text>

      <text x="480" y="0" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" fill="#00A8E8">1:1</text>
      <text x="480" y="24" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B949E" letter-spacing="1">CAREER COACHING</text>
    </g>

    <!-- CTA -->
    <rect x="60" y="880" width="260" height="52" rx="4" fill="url(#hexBlueGrad)"/>
    <text x="190" y="912" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" letter-spacing="2">ENROLL NOW</text>

    <!-- Tagline bottom -->
    <text x="60" y="1000" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="400" fill="#8B949E" letter-spacing="4" opacity="0.5">STRUCTURE IN MOTION</text>
    <text x="60" y="1020" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="300" fill="#8B949E" letter-spacing="1" opacity="0.4">www.omnyragroup.online</text>

    <!-- Bottom accent -->
    <rect x="0" y="1076" width="1080" height="4" fill="url(#hexBlueGrad)"/>
  </g>
</svg>
