<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1F3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BBFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7A8A9A;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#D0D8E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8B4C2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sqClip"><rect width="1080" height="1080"/></clipPath>
  </defs>

  <g clip-path="url(#sqClip)">
    <!-- Background -->
    <rect width="1080" height="1080" fill="url(#bgGrad)"/>

    <!-- Orbital pattern -->
    <circle cx="850" cy="200" r="300" fill="none" stroke="#0099FF" stroke-width="0.5" opacity="0.06" stroke-dasharray="6 12"/>
    <circle cx="850" cy="200" r="400" fill="none" stroke="#0099FF" stroke-width="0.3" opacity="0.04" stroke-dasharray="3 15"/>
    <circle cx="200" cy="900" r="250" fill="none" stroke="#0099FF" stroke-width="0.3" opacity="0.04" stroke-dasharray="3 12"/>

    <!-- Top accent line -->
    <rect x="0" y="0" width="1080" height="4" fill="url(#blueGrad)"/>

    <!-- Logo top-left -->
    <g transform="translate(60, 50) scale(0.5)">
      <g transform="translate(40, 40)">
        <circle cx="0" cy="0" r="34" fill="none" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-dasharray="24 6 24 6 24 6 24 6" stroke-linecap="round"/>
        <circle cx="32" cy="-11" r="3" fill="#A8B4C2"/>
        <circle cx="11" cy="-32" r="2.8" fill="#A8B4C2"/>
        <circle cx="-28" cy="-19" r="2.8" fill="#A8B4C2"/>
        <circle cx="-28" cy="19" r="2.8" fill="#A8B4C2"/>
        <circle cx="0" cy="0" r="26" fill="url(#blueGrad)"/>
        <circle cx="0" cy="0" r="19" fill="#0A1628" opacity="0.55"/>
        <path d="M -8,8 L 11,-11" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <polygon points="11,-11 5,-11 11,-5" fill="white"/>
      </g>
      <text x="86" y="38" font-family="'Inter', Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="1">OMN</text>
      <text x="146" y="38" font-family="'Inter', Arial, sans-serif" font-size="26" font-weight="300" fill="#0099FF">yra</text>
      <text x="86" y="56" font-family="'Inter', Arial, sans-serif" font-size="8.5" font-weight="500" fill="#A8B4C2" letter-spacing="4.5">GROUP</text>
    </g>

    <!-- Domain badge -->
    <rect x="60" y="140" width="50" height="24" rx="4" fill="#0099FF" opacity="0.15"/>
    <text x="85" y="156" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="600" fill="#0099FF" letter-spacing="1">GRC</text>

    <!-- Main headline -->
    <text x="60" y="360" font-family="'Inter', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">FROM THEORY</text>
    <text x="60" y="440" font-family="'Inter', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">TO GRC</text>
    <text x="60" y="520" font-family="'Inter', Arial, sans-serif" font-size="72" font-weight="300" fill="#0099FF" letter-spacing="-1">MASTERY</text>

    <!-- Divider -->
    <line x1="60" y1="560" x2="300" y2="560" stroke="#0099FF" stroke-width="2" opacity="0.5"/>

    <!-- Subtext -->
    <text x="60" y="610" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#A8B4C2" letter-spacing="0.5">Practitioner-led GRC training.</text>
    <text x="60" y="645" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#A8B4C2" letter-spacing="0.5">Career strategy coaching.</text>
    <text x="60" y="680" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#A8B4C2" letter-spacing="0.5">Real-world readiness.</text>

    <!-- Stats row -->
    <g transform="translate(60, 760)">
      <text x="0" y="0" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" fill="#0099FF">95%</text>
      <text x="0" y="24" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#A8B4C2" letter-spacing="1">PLACEMENT RATE</text>

      <text x="240" y="0" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" fill="#0099FF">4+</text>
      <text x="240" y="24" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#A8B4C2" letter-spacing="1">GRC DOMAINS</text>

      <text x="480" y="0" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" fill="#0099FF">1:1</text>
      <text x="480" y="24" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#A8B4C2" letter-spacing="1">CAREER COACHING</text>
    </g>

    <!-- CTA -->
    <rect x="60" y="880" width="260" height="52" rx="4" fill="url(#blueGrad)"/>
    <text x="190" y="912" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" letter-spacing="2">ENROLL NOW</text>

    <!-- Tagline bottom -->
    <text x="60" y="1000" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="400" fill="#A8B4C2" letter-spacing="4" opacity="0.5">PRECISION IN MOTION</text>
    <text x="60" y="1020" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="300" fill="#A8B4C2" letter-spacing="1" opacity="0.4">www.omnyragroup.online</text>

    <!-- Bottom accent -->
    <rect x="0" y="1076" width="1080" height="4" fill="url(#blueGrad)"/>
  </g>
</svg>