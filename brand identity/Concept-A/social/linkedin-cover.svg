<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1F3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BBFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7A8A9A;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#D0D8E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8B4C2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>

  <!-- Orbital patterns -->
  <circle cx="200" cy="198" r="200" fill="none" stroke="#0099FF" stroke-width="0.4" opacity="0.06" stroke-dasharray="5 10"/>
  <circle cx="200" cy="198" r="280" fill="none" stroke="#0099FF" stroke-width="0.3" opacity="0.04" stroke-dasharray="3 14"/>
  <circle cx="1400" cy="198" r="180" fill="none" stroke="#0099FF" stroke-width="0.3" opacity="0.04" stroke-dasharray="3 12"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1584" height="3" fill="url(#blueGrad)"/>

  <!-- Logo -->
  <g transform="translate(80, 140) scale(0.55)">
    <g transform="translate(40, 40)">
      <circle cx="0" cy="0" r="36" fill="none" stroke="url(#chromeGrad)" stroke-width="5" stroke-dasharray="25 6 25 6 25 6 25 6" stroke-linecap="round"/>
      <circle cx="34" cy="-11" r="3.2" fill="#A8B4C2"/>
      <circle cx="11" cy="-34" r="3" fill="#A8B4C2"/>
      <circle cx="-28" cy="-20" r="3" fill="#A8B4C2"/>
      <circle cx="-28" cy="20" r="3" fill="#A8B4C2"/>
      <circle cx="0" cy="0" r="28" fill="url(#blueGrad)"/>
      <circle cx="0" cy="0" r="20" fill="#0A1628" opacity="0.55"/>
      <g filter="url(#glow)">
        <path d="M -9,9 L 12,-12" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <polygon points="12,-12 6,-12 12,-6" fill="white"/>
      </g>
    </g>
    <text x="88" y="38" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">OMN</text>
    <text x="152" y="38" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="300" fill="#0099FF">yra</text>
    <text x="88" y="58" font-family="'Inter', Arial, sans-serif" font-size="9" font-weight="500" fill="#A8B4C2" letter-spacing="5">GROUP</text>
  </g>

  <!-- Main text -->
  <text x="560" y="180" font-family="'Inter', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">FROM THEORY</text>
  <text x="560" y="230" font-family="'Inter', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">TO GRC</text>
  <text x="560" y="280" font-family="'Inter', Arial, sans-serif" font-size="44" font-weight="300" fill="#0099FF" letter-spacing="-0.5">MASTERY</text>

  <!-- Tagline -->
  <text x="560" y="330" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="400" fill="#A8B4C2" letter-spacing="3">GRC TRAINING · RISK ADVISORY · CAREER STRATEGY</text>

  <!-- Divider -->
  <line x1="560" y1="300" x2="760" y2="300" stroke="#0099FF" stroke-width="1.5" opacity="0.4"/>

  <!-- CTA -->
  <text x="560" y="370" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="500" fill="#0099FF" letter-spacing="2">PRECISION IN MOTION — OMNYRAGROUP.ONLINE</text>

  <!-- Bottom accent -->
  <rect x="0" y="393" width="1584" height="3" fill="url(#blueGrad)"/>
</svg>