<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1F3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BBFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7A8A9A;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#D0D8E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8B4C2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bgGradient)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#0099FF" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/><line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/><line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/><line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/><line x1="850" y1="0" x2="850" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/><line x1="950" y1="0" x2="950" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/><line x1="1050" y1="0" x2="1050" y2="500"/>
    <line x1="1100" y1="0" x2="1100" y2="500"/><line x1="1150" y1="0" x2="1150" y2="500"/>
    <line x1="1200" y1="0" x2="1200" y2="500"/><line x1="1250" y1="0" x2="1250" y2="500"/>
    <line x1="1300" y1="0" x2="1300" y2="500"/><line x1="1350" y1="0" x2="1350" y2="500"/>
    <line x1="1400" y1="0" x2="1400" y2="500"/><line x1="1450" y1="0" x2="1450" y2="500"/>
    <line x1="1500" y1="0" x2="1500" y2="500"/>
    <line x1="0" y1="50" x2="1500" y2="50"/><line x1="0" y1="100" x2="1500" y2="100"/>
    <line x1="0" y1="150" x2="1500" y2="150"/><line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="250" x2="1500" y2="250"/><line x1="0" y1="300" x2="1500" y2="300"/>
    <line x1="0" y1="350" x2="1500" y2="350"/><line x1="0" y1="400" x2="1500" y2="400"/>
    <line x1="0" y1="450" x2="1500" y2="450"/>
  </g>

  <!-- Decorative orbital lines -->
  <circle cx="200" cy="250" r="180" fill="none" stroke="#0099FF" stroke-width="0.5" opacity="0.1" stroke-dasharray="4 8"/>
  <circle cx="200" cy="250" r="220" fill="none" stroke="#0099FF" stroke-width="0.3" opacity="0.08" stroke-dasharray="2 12"/>
  <circle cx="1300" cy="250" r="160" fill="none" stroke="#0099FF" stroke-width="0.3" opacity="0.06" stroke-dasharray="2 10"/>

  <!-- Logo - emblem -->
  <g transform="translate(200, 250)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#chromeGrad)" stroke-width="9" stroke-dasharray="56 14 56 14 56 14 56 14" stroke-linecap="round"/>
    <circle cx="76" cy="-25" r="7" fill="url(#chromeGrad)" stroke="#5A6A7A" stroke-width="1"/>
    <circle cx="25" cy="-76" r="6" fill="url(#chromeGrad)" stroke="#5A6A7A" stroke-width="1"/>
    <circle cx="-64" cy="-46" r="6" fill="url(#chromeGrad)" stroke="#5A6A7A" stroke-width="1"/>
    <circle cx="-64" cy="46" r="6" fill="url(#chromeGrad)" stroke="#5A6A7A" stroke-width="1"/>
    <circle cx="0" cy="0" r="62" fill="url(#blueGrad)" opacity="0.95"/>
    <circle cx="0" cy="0" r="46" fill="#0A1628" opacity="0.6"/>
    <g filter="url(#glow)">
      <path d="M -22,22 L 26,-26" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
      <polygon points="26,-26 12,-26 26,-12" fill="white"/>
    </g>
    <circle cx="0" cy="0" r="56" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="8 4"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(320, 210)">
    <text x="0" y="50" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="3">OMN</text>
    <text x="200" y="50" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="300" fill="#0099FF" letter-spacing="1">yra</text>
    <text x="355" y="28" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#A8B4C2">™</text>
    <text x="210" y="90" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#A8B4C2" letter-spacing="16">GROUP</text>
    <line x1="0" y1="102" x2="180" y2="102" stroke="#A8B4C2" stroke-width="1" opacity="0.3"/>
    <line x1="370" y1="102" x2="560" y2="102" stroke="#A8B4C2" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Subtle tagline -->
  <text x="320" y="360" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" fill="#A8B4C2" letter-spacing="6" opacity="0.5">PRECISION IN MOTION</text>
</svg>