<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48E0FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0B0F1A"/>

  <!-- Outer glowing ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#cyanGlowGrad)" stroke-width="2" filter="url(#glow)" opacity="0.8"/>

  <!-- Framework lines -->
  <g opacity="0.5">
    <line x1="32" y1="6" x2="32" y2="18" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="54" y1="18" x2="42" y2="24" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="54" y1="46" x2="42" y2="40" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="32" y1="58" x2="32" y2="46" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="10" y1="46" x2="22" y2="40" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="10" y1="18" x2="22" y2="24" stroke="#00D4FF" stroke-width="1.5"/>
  </g>

  <!-- Inner circle -->
  <circle cx="32" cy="32" r="20" fill="#00D4FF" opacity="0.15"/>

  <!-- Inner dark -->
  <circle cx="32" cy="32" r="14" fill="#0B0F1A" opacity="0.8"/>

  <!-- Framework grid inside -->
  <g opacity="0.3">
    <line x1="22" y1="26" x2="42" y2="26" stroke="#00D4FF" stroke-width="0.8"/>
    <line x1="22" y1="32" x2="42" y2="32" stroke="#00D4FF" stroke-width="0.8"/>
    <line x1="22" y1="38" x2="42" y2="38" stroke="#00D4FF" stroke-width="0.8"/>
    <line x1="26" y1="22" x2="26" y2="42" stroke="#00D4FF" stroke-width="0.8"/>
    <line x1="32" y1="22" x2="32" y2="42" stroke="#00D4FF" stroke-width="0.8"/>
    <line x1="38" y1="22" x2="38" y2="42" stroke="#00D4FF" stroke-width="0.8"/>
  </g>

  <!-- Arrow -->
  <path d="M 25,39 L 38,26" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <polygon points="38,26 33,26 38,31" fill="white"/>

  <!-- Tungsten accent nodes -->
  <circle cx="32" cy="6" r="2.5" fill="#FF9F43"/>
  <circle cx="54" cy="18" r="2" fill="#FF9F43"/>
  <circle cx="54" cy="46" r="2" fill="#FF9F43"/>
  <circle cx="32" cy="58" r="2.5" fill="#FF9F43"/>
  <circle cx="10" cy="46" r="2" fill="#FF9F43"/>
  <circle cx="10" cy="18" r="2" fill="#FF9F43"/>
</svg>
