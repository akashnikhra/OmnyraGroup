<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48E0FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sqClip"><rect width="1080" height="1080"/></clipPath>
  </defs>

  <g clip-path="url(#sqClip)">
    <!-- Background -->
    <rect width="1080" height="1080" fill="url(#bgGrad)"/>

    <!-- Glowing framework grid pattern -->
    <g opacity="0.05" stroke="#00D4FF" stroke-width="0.5">
      <line x1="850" y1="0" x2="850" y2="1080"/><line x1="900" y1="0" x2="900" y2="1080"/>
      <line x1="950" y1="0" x2="950" y2="1080"/><line x1="1000" y1="0" x2="1000" y2="1080"/>
      <line x1="1050" y1="0" x2="1050" y2="1080"/>
      <line x1="0" y1="200" x2="1080" y2="200"/><line x1="0" y1="400" x2="1080" y2="400"/>
      <line x1="0" y1="600" x2="1080" y2="600"/><line x1="0" y1="800" x2="1080" y2="800"/>
    </g>

    <!-- Top accent line -->
    <rect x="0" y="0" width="1080" height="4" fill="url(#cyanGlowGrad)"/>

    <!-- Logo top-left -->
    <g transform="translate(60, 50) scale(0.5)">
      <g transform="translate(40, 40)">
        <circle cx="0" cy="0" r="34" fill="none" stroke="url(#cyanGlowGrad)" stroke-width="2" filter="url(#glow)" opacity="0.8"/>
        <g opacity="0.5">
          <line x1="0" y1="-34" x2="0" y2="-20" stroke="#00D4FF" stroke-width="1.5"/>
          <line x1="30" y1="-17" x2="17" y2="-10" stroke="#00D4FF" stroke-width="1.5"/>
          <line x1="30" y1="17" x2="17" y2="10" stroke="#00D4FF" stroke-width="1.5"/>
          <line x1="0" y1="34" x2="0" y2="20" stroke="#00D4FF" stroke-width="1.5"/>
          <line x1="-30" y1="17" x2="-17" y2="10" stroke="#00D4FF" stroke-width="1.5"/>
          <line x1="-30" y1="-17" x2="-17" y2="-10" stroke="#00D4FF" stroke-width="1.5"/>
        </g>
        <circle cx="0" cy="0" r="26" fill="#00D4FF" opacity="0.15"/>
        <circle cx="0" cy="0" r="19" fill="#0B0F1A" opacity="0.55"/>
        <path d="M -8,8 L 11,-11" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <polygon points="11,-11 5,-11 11,-5" fill="white"/>
      </g>
      <text x="86" y="38" font-family="'Inter', Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="1">OMN</text>
      <text x="146" y="38" font-family="'Inter', Arial, sans-serif" font-size="26" font-weight="300" fill="#00D4FF">yra</text>
      <text x="86" y="56" font-family="'Inter', Arial, sans-serif" font-size="8.5" font-weight="500" fill="#6B7280" letter-spacing="4.5">GROUP</text>
    </g>

    <!-- Domain badge -->
    <rect x="60" y="140" width="50" height="24" rx="4" fill="#00D4FF" opacity="0.15"/>
    <text x="85" y="156" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="600" fill="#00D4FF" letter-spacing="1">GRC</text>

    <!-- Main headline -->
    <text x="60" y="360" font-family="'Inter', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">FROM THEORY</text>
    <text x="60" y="440" font-family="'Inter', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">TO GRC</text>
    <text x="60" y="520" font-family="'Inter', Arial, sans-serif" font-size="72" font-weight="300" fill="#00D4FF" letter-spacing="-1">MASTERY</text>

    <!-- Divider -->
    <line x1="60" y1="560" x2="300" y2="560" stroke="#00D4FF" stroke-width="2" opacity="0.5"/>

    <!-- Subtext -->
    <text x="60" y="610" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7280" letter-spacing="0.5">Practitioner-led GRC training.</text>
    <text x="60" y="645" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7280" letter-spacing="0.5">Career strategy coaching.</text>
    <text x="60" y="680" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7280" letter-spacing="0.5">Real-world readiness.</text>

    <!-- Stats row -->
    <g transform="translate(60, 760)">
      <text x="0" y="0" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" fill="#00D4FF">95%</text>
      <text x="0" y="24" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" letter-spacing="1">PLACEMENT RATE</text>

      <text x="240" y="0" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" fill="#00D4FF">4+</text>
      <text x="240" y="24" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" letter-spacing="1">GRC DOMAINS</text>

      <text x="480" y="0" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" fill="#00D4FF">1:1</text>
      <text x="480" y="24" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" letter-spacing="1">CAREER COACHING</text>
    </g>

    <!-- CTA -->
    <rect x="60" y="880" width="260" height="52" rx="4" fill="url(#cyanGlowGrad)"/>
    <text x="190" y="912" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" letter-spacing="2">ENROLL NOW</text>

    <!-- Tagline bottom -->
    <text x="60" y="1000" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280" letter-spacing="4" opacity="0.5">CLARITY IN MOTION</text>
    <text x="60" y="1020" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="300" fill="#6B7280" letter-spacing="1" opacity="0.4">www.omnyragroup.online</text>

    <!-- Bottom accent -->
    <rect x="0" y="1076" width="1080" height="4" fill="url(#cyanGlowGrad)"/>
  </g>
</svg>
