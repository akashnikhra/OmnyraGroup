<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48E0FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Outer glowing ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="url(#cyanGlowGrad)" stroke-width="3" filter="url(#glow)" opacity="0.8"/>
    
    <!-- Framework lines radiating from center -->
    <g filter="url(#softGlow)" opacity="0.6">
      <line x1="0" y1="-82" x2="0" y2="-48" stroke="#00D4FF" stroke-width="1.8"/>
      <line x1="71" y1="-41" x2="41" y2="-24" stroke="#00D4FF" stroke-width="1.8"/>
      <line x1="71" y1="41" x2="41" y2="24" stroke="#00D4FF" stroke-width="1.8"/>
      <line x1="0" y1="82" x2="0" y2="48" stroke="#00D4FF" stroke-width="1.8"/>
      <line x1="-71" y1="41" x2="-41" y2="24" stroke="#00D4FF" stroke-width="1.8"/>
      <line x1="-71" y1="-41" x2="-41" y2="-24" stroke="#00D4FF" stroke-width="1.8"/>
    </g>
    
    <!-- Inner circle with gradient -->
    <circle cx="0" cy="0" r="64" fill="url(#cyanGlowGrad)" opacity="0.15"/>
    
    <!-- Dark inner core -->
    <circle cx="0" cy="0" r="48" fill="#0B0F1A" opacity="0.8"/>
    
    <!-- Glowing framework grid inside -->
    <g filter="url(#softGlow)" opacity="0.3">
      <line x1="-35" y1="-17" x2="35" y2="-17" stroke="#00D4FF" stroke-width="1"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#00D4FF" stroke-width="1"/>
      <line x1="-35" y1="17" x2="35" y2="17" stroke="#00D4FF" stroke-width="1"/>
      <line x1="-17" y1="-35" x2="-17" y2="35" stroke="#00D4FF" stroke-width="1"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#00D4FF" stroke-width="1"/>
      <line x1="17" y1="-35" x2="17" y2="35" stroke="#00D4FF" stroke-width="1"/>
    </g>
    
    <!-- Ascending arrow -->
    <g filter="url(#glow)">
      <path d="M -20,20 L 26,-26" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <polygon points="26,-26 12,-26 26,-12" fill="white"/>
    </g>
    
    <!-- Tungsten accent nodes -->
    <circle cx="0" cy="-82" r="5" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="71" cy="-41" r="4.5" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="71" cy="41" r="4.5" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="0" cy="82" r="5" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="-71" cy="41" r="4.5" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="-71" cy="-41" r="4.5" fill="#FF9F43" filter="url(#softGlow)"/>
  </g>
</svg>
