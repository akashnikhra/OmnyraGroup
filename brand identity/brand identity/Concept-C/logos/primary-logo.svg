<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48E0FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tungstenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E08520;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF9F43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB86C;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- EMBLEM - Luminous Framework -->
  <g transform="translate(100, 100)">
    <!-- Outer glowing ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#cyanGlowGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.8"/>
    
    <!-- Framework lines radiating from center -->
    <g filter="url(#softGlow)" opacity="0.6">
      <line x1="0" y1="-72" x2="0" y2="-42" stroke="#00D4FF" stroke-width="1.5"/>
      <line x1="62" y1="-36" x2="36" y2="-21" stroke="#00D4FF" stroke-width="1.5"/>
      <line x1="62" y1="36" x2="36" y2="21" stroke="#00D4FF" stroke-width="1.5"/>
      <line x1="0" y1="72" x2="0" y2="42" stroke="#00D4FF" stroke-width="1.5"/>
      <line x1="-62" y1="36" x2="-36" y2="21" stroke="#00D4FF" stroke-width="1.5"/>
      <line x1="-62" y1="-36" x2="-36" y2="-21" stroke="#00D4FF" stroke-width="1.5"/>
    </g>
    
    <!-- Inner circle with gradient -->
    <circle cx="0" cy="0" r="56" fill="url(#cyanGlowGrad)" opacity="0.15"/>
    
    <!-- Dark inner core -->
    <circle cx="0" cy="0" r="42" fill="#0B0F1A" opacity="0.8"/>
    
    <!-- Glowing framework grid inside -->
    <g filter="url(#softGlow)" opacity="0.3">
      <line x1="-30" y1="-15" x2="30" y2="-15" stroke="#00D4FF" stroke-width="0.8"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#00D4FF" stroke-width="0.8"/>
      <line x1="-30" y1="15" x2="30" y2="15" stroke="#00D4FF" stroke-width="0.8"/>
      <line x1="-15" y1="-30" x2="-15" y2="30" stroke="#00D4FF" stroke-width="0.8"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#00D4FF" stroke-width="0.8"/>
      <line x1="15" y1="-30" x2="15" y2="30" stroke="#00D4FF" stroke-width="0.8"/>
    </g>
    
    <!-- Ascending arrow - the light breaking through -->
    <g filter="url(#glow)">
      <path d="M -18,18 L 22,-22" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
      <polygon points="22,-22 10,-22 22,-10" fill="white"/>
    </g>
    
    <!-- Tungsten accent nodes -->
    <circle cx="0" cy="-72" r="4" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="62" cy="-36" r="3.5" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="62" cy="36" r="3.5" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="0" cy="72" r="4" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="-62" cy="36" r="3.5" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="-62" cy="-36" r="3.5" fill="#FF9F43" filter="url(#softGlow)"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(200, 72)">
    <!-- OMN - Bold -->
    <text x="0" y="52" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="3">OMN</text>
    <!-- yra - Light, Cyan -->
    <text x="188" y="52" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="300" fill="#00D4FF" letter-spacing="1">yra</text>
    <!-- TM -->
    <text x="328" y="30" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280">™</text>

    <!-- GROUP - tracked -->
    <text x="195" y="90" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#6B7280" letter-spacing="14">GROUP</text>

    <!-- Decorative lines flanking GROUP -->
    <line x1="0" y1="80" x2="170" y2="80" stroke="#6B7280" stroke-width="1" opacity="0.4"/>
    <line x1="340" y1="80" x2="520" y2="80" stroke="#6B7280" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
