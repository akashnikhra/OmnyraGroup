  <text x="50" y="130" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#0B0F1A">[Date]</text>

  <!-- Recipient placeholder -->
  <text x="50" y="165" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#0B0F1A">[Recipient Name]</text>
  <text x="50" y="180" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#0B0F1A">[Title]</text>
  <text x="50" y="195" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#0B0F1A">[Company]</text>
  <text x="50" y="210" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#0B0F1A">[Address Line 1]</text>
  <text x="50" y="225" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#0B0F1A">[City, State, Postal Code]</text>

