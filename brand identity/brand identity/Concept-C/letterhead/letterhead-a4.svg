      <line x1="121" y1="-70" x2="70" y2="-40" stroke="#00D4FF" stroke-width="4"/>
      <line x1="121" y1="70" x2="70" y2="40" stroke="#00D4FF" stroke-width="4"/>
      <line x1="0" y1="140" x2="0" y2="80" stroke="#00D4FF" stroke-width="4"/>
      <line x1="-121" y1="70" x2="-70" y2="40" stroke="#00D4FF" stroke-width="4"/>
      <line x1="-121" y1="-70" x2="-70" y2="-40" stroke="#00D4FF" stroke-width="4"/>
