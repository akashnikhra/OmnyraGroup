    <circle cx="0" cy="0" r="104" fill="#00D4FF" opacity="0.3"/>
    <circle cx="0" cy="0" r="78" fill="#0B0F1A" opacity="0.4"/>
    <g opacity="0.3">
      <line x1="-60" y1="-30" x2="60" y2="-30" stroke="#00D4FF" stroke-width="2"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#00D4FF" stroke-width="2"/>
      <line x1="-60" y1="30" x2="60" y2="30" stroke="#00D4FF" stroke-width="2"/>
      <line x1="-30" y1="-60" x2="-30" y2="60" stroke="#00D4FF" stroke-width="2"/>
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#00D4FF" stroke-width="2"/>
      <line x1="30" y1="-60" x2="30" y2="60" stroke="#00D4FF" stroke-width="2"/>
    </g>
    <path d="M -34,34 L 42,-42" stroke="#00D4FF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.5"/>
    <polygon points="42,-42 22,-42 42,-22" fill="#00D4FF" opacity="0.5"/>
  </g>

