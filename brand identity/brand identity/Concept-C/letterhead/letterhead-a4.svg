<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842">
  <defs>
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48E0FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="595" height="842" fill="#FFFFFF"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="595" height="4" fill="url(#cyanGlowGrad)"/>

  <!-- Header section -->
  <!-- Logo -->
  <g transform="translate(50, 40)">
    <g transform="scale(0.35)">
      <g transform="translate(60, 60)">
        <circle cx="0" cy="0" r="42" fill="none" stroke="url(#cyanGlowGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.8"/>
        <g opacity="0.5">
          <line x1="0" y1="-42" x2="0" y2="-24" stroke="#00D4FF" stroke-width="1.8"/>
          <line x1="36" y1="-21" x2="21" y2="-12" stroke="#00D4FF" stroke-width="1.8"/>
          <line x1="36" y1="21" x2="21" y2="12" stroke="#00D4FF" stroke-width="1.8"/>
          <line x1="0" y1="42" x2="0" y2="24" stroke="#00D4FF" stroke-width="1.8"/>
          <line x1="-36" y1="21" x2="-21" y2="12" stroke="#00D4FF" stroke-width="1.8"/>
          <line x1="-36" y1="-21" x2="-21" y2="-12" stroke="#00D4FF" stroke-width="1.8"/>
        </g>
        <circle cx="0" cy="0" r="33" fill="#00D4FF" opacity="0.15"/>
        <circle cx="0" cy="0" r="24" fill="#0B0F1A" opacity="0.55"/>
        <path d="M -10,10 L 13,-13" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <polygon points="13,-13 7,-13 13,-7" fill="white"/>
      </g>
      <text x="85" y="58" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="#0B0F1A" letter-spacing="1">OMN</text>
      <text x="150" y="58" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="300" fill="#00D4FF" letter-spacing="0.5">yra</text>
      <text x="85" y="78" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="500" fill="#6B7280" letter-spacing="6">GROUP</text>
    </g>
  </g>

  <!-- Company details - right aligned -->
  <text x="545" y="48" text-anchor="end" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="400" fill="#6B7280" letter-spacing="0.5">OmnyraGroup™</text>
  <text x="545" y="60" text-anchor="end" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="7" font-weight="300" fill="#6B7280" letter-spacing="0.5">Information Security Training &amp; Risk Advisory</text>
  <text x="545" y="72" text-anchor="end" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="7" font-weight="300" fill="#C9D1D9" letter-spacing="0.3">www.omnyragroup.online</text>

