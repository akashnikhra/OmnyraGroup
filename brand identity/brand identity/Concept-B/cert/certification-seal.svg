<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="hexBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeLatticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9D1D9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Circular text path -->
    <path id="textCircle" d="M 150,150 m -105,0 a 105,105 0 1,1 210,0 a 105,105 0 1,1 -210,0" fill="none"/>
    <path id="textCircleBottom" d="M 150,150 m -80,0 a 80,80 0 1,0 160,0 a 80,80 0 1,0 -160,0" fill="none"/>
  </defs>

  <!-- Outer decorative ring -->
  <circle cx="150" cy="150" r="145" fill="none" stroke="#0D1117" stroke-width="2"/>
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="4"/>
  <circle cx="150" cy="150" r="132" fill="none" stroke="#8B949E" stroke-width="1" opacity="0.3"/>

  <!-- Hexagonal frame -->
  <polygon points="150,30 230,70 230,190 150,230 70,190 70,70" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Inner hexagonal frame -->
  <polygon points="150,55 210,85 210,175 150,205 90,175 90,85" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="3" opacity="0.5"/>

  <!-- Hexagonal blue fill -->
  <polygon points="150,70 198,95 198,165 150,190 102,165 102,95" fill="url(#hexBlueGrad)"/>

  <!-- Inner dark hexagon -->
  <polygon points="150,90 180,108 180,152 150,170 120,152 120,108" fill="#0D1117" opacity="0.55"/>

  <!-- Central emblem -->
  <g filter="url(#glow)">
    <path d="M 130,155 L 150,135 L 170,115 L 178,107" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="178,107 170,107 178,115" fill="white"/>
  </g>

  <!-- Junction nodes -->
  <circle cx="150" cy="30" r="5" fill="#C9D1D9"/>
  <circle cx="230" cy="70" r="5" fill="#C9D1D9"/>
  <circle cx="230" cy="190" r="5" fill="#C9D1D9"/>
  <circle cx="150" cy="230" r="5" fill="#C9D1D9"/>
  <circle cx="70" cy="190" r="5" fill="#C9D1D9"/>
  <circle cx="70" cy="70" r="5" fill="#C9D1D9"/>

  <!-- Circular text - top -->
  <text font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0D1117" letter-spacing="5">
    <textPath href="#textCircle" startOffset="12%">CERTIFIED BY OMNYRAGROUP</textPath>
  </text>

  <!-- Decorative dots between text -->
  <circle cx="75" cy="152" r="2.5" fill="#00A8E8"/>
  <circle cx="225" cy="152" r="2.5" fill="#00A8E8"/>

  <!-- Circular text - bottom -->
  <text font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#8B949E" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="18%">SECURITY · PRECISION · TRUST</textPath>
  </text>

  <!-- Outer decorative dots -->
  <circle cx="150" cy="6" r="3" fill="#8B949E"/>
  <circle cx="150" cy="294" r="3" fill="#8B949E"/>
  <circle cx="6" cy="150" r="3" fill="#8B949E"/>
  <circle cx="294" cy="150" r="3" fill="#8B949E"/>
</svg>
