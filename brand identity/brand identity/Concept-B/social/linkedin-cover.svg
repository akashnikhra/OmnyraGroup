<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hexBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeLatticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9D1D9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>

  <!-- Hexagonal lattice pattern -->
  <g opacity="0.04" stroke="#00A8E8" stroke-width="0.4" fill="none">
    <polygon points="100,50 130,30 160,50 160,90 130,110 100,90"/>
    <polygon points="160,50 190,30 220,50 220,90 190,110 160,90"/>
    <polygon points="220,50 250,30 280,50 280,90 250,110 220,90"/>
    <polygon points="100,110 130,90 160,110 160,150 130,170 100,150"/>
    <polygon points="160,110 190,90 220,110 220,150 190,170 160,150"/>
    <polygon points="220,110 250,90 280,110 280,150 250,170 220,150"/>
    <polygon points="100,170 130,150 160,170 160,210 130,230 100,210"/>
    <polygon points="160,170 190,150 220,170 220,210 190,230 160,210"/>
    <polygon points="220,170 250,150 280,170 280,210 250,230 220,210"/>
  </g>

  <!-- Top accent -->
  <rect x="0" y="0" width="1584" height="3" fill="url(#hexBlueGrad)"/>

  <!-- Logo -->
  <g transform="translate(80, 140) scale(0.55)">
    <g transform="translate(40, 40)">
      <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="url(#hexBlueGrad)" opacity="0.9"/>
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="#0D1117" opacity="0.55"/>
      <path d="M -8,8 L 0,0 L 8,-8 L 11,-11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polygon points="11,-11 6,-11 11,-6" fill="white"/>
    </g>
    <text x="88" y="38" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">OMN</text>
    <text x="152" y="38" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="300" fill="#00A8E8">yra</text>
    <text x="88" y="58" font-family="'Inter', Arial, sans-serif" font-size="9" font-weight="500" fill="#8B949E" letter-spacing="5">GROUP</text>
  </g>

  <!-- Main text -->
  <text x="560" y="180" font-family="'Inter', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">STRUCTURE</text>
  <text x="560" y="230" font-family="'Inter', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">IN MOTION</text>

  <!-- Tagline -->
  <text x="560" y="280" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="400" fill="#8B949E" letter-spacing="3">GRC TRAINING · RISK ADVISORY · CAREER STRATEGY</text>

  <!-- Divider -->
  <line x1="560" y1="250" x2="760" y2="250" stroke="#00A8E8" stroke-width="1.5" opacity="0.4"/>

  <!-- CTA -->
  <text x="560" y="330" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="500" fill="#00A8E8" letter-spacing="2">STRUCTURE IN MOTION — OMNYRAGROUP.ONLINE</text>

  <!-- Bottom accent -->
  <rect x="0" y="393" width="1584" height="3" fill="url(#hexBlueGrad)"/>
</svg>
