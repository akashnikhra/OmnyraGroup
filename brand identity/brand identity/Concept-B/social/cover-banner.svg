<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hexBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeLatticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9D1D9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bgGradient)"/>

  <!-- Hexagonal lattice pattern -->
  <g opacity="0.04" stroke="#00A8E8" stroke-width="0.5" fill="none">
    <polygon points="50,50 80,30 110,50 110,90 80,110 50,90"/>
    <polygon points="110,50 140,30 170,50 170,90 140,110 110,90"/>
    <polygon points="170,50 200,30 230,50 230,90 200,110 170,90"/>
    <polygon points="230,50 260,30 290,50 290,90 260,110 230,90"/>
    <polygon points="290,50 320,30 350,50 350,90 320,110 290,90"/>
    <polygon points="350,50 380,30 410,50 410,90 380,110 350,90"/>
  </g>

  <!-- Logo - emblem -->
  <g transform="translate(200, 250)">
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="2.5" opacity="0.5"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="url(#hexBlueGrad)" opacity="0.9"/>
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#0D1117" opacity="0.6"/>
    <path d="M -20,20 L 0,0 L 20,-20 L 26,-26" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="26,-26 17,-26 26,-17" fill="white"/>
    <circle cx="0" cy="-62" r="5" fill="#C9D1D9"/>
    <circle cx="54" cy="-31" r="5" fill="#C9D1D9"/>
    <circle cx="54" cy="31" r="5" fill="#C9D1D9"/>
    <circle cx="0" cy="62" r="5" fill="#C9D1D9"/>
    <circle cx="-54" cy="31" r="5" fill="#C9D1D9"/>
    <circle cx="-54" cy="-31" r="5" fill="#C9D1D9"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(320, 210)">
    <text x="0" y="50" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="3">OMN</text>
    <text x="200" y="50" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="300" fill="#00A8E8" letter-spacing="1">yra</text>
    <text x="355" y="28" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#8B949E">™</text>
    <text x="210" y="90" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#8B949E" letter-spacing="16">GROUP</text>
    <line x1="0" y1="102" x2="180" y2="102" stroke="#8B949E" stroke-width="1" opacity="0.3"/>
    <line x1="370" y1="102" x2="560" y2="102" stroke="#8B949E" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Subtle tagline -->
  <text x="320" y="360" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" fill="#8B949E" letter-spacing="6" opacity="0.5">STRUCTURE IN MOTION</text>
</svg>
