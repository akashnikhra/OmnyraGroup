<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="hexBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeLatticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9D1D9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#161B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- EMBLEM centered and scaled -->
  <g transform="translate(200, 200)">
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="0,-86 74,-43 74,43 0,86 -74,43 -74,-43" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="3" opacity="0.5"/>
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="url(#hexBlueGrad)" opacity="0.9"/>
    <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" fill="#0D1117" opacity="0.6"/>
    <g filter="url(#glow)">
      <path d="M -26,26 L 0,0 L 26,-26 L 32,-32" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polygon points="32,-32 22,-32 32,-22" fill="white"/>
    </g>
    <circle cx="0" cy="-86" r="7" fill="#C9D1D9"/>
    <circle cx="74" cy="-43" r="7" fill="#C9D1D9"/>
    <circle cx="74" cy="43" r="7" fill="#C9D1D9"/>
    <circle cx="0" cy="86" r="7" fill="#C9D1D9"/>
    <circle cx="-74" cy="43" r="7" fill="#C9D1D9"/>
    <circle cx="-74" cy="-43" r="7" fill="#C9D1D9"/>
  </g>
</svg>
