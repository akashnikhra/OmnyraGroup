<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hexBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeLatticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9D1D9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Outer hexagonal frame -->
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Inner hexagonal frame -->
    <polygon points="0,-64 55,-32 55,32 0,64 -55,32 -55,-32" fill="none" stroke="url(#chromeLatticeGrad)" stroke-width="2.5" opacity="0.5"/>
    
    <!-- Hexagonal blue fill -->
    <polygon points="0,-56 49,-28 49,28 0,56 -49,28 -49,-28" fill="url(#hexBlueGrad)" opacity="0.9"/>
    
    <!-- Inner dark hexagon -->
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="#0D1117" opacity="0.6"/>
    
    <!-- Ascending path through hexagon -->
    <g filter="url(#glow)">
      <path d="M -20,20 L 0,0 L 20,-20 L 26,-26" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polygon points="26,-26 17,-26 26,-17" fill="white"/>
    </g>
    
    <!-- Hexagonal junction nodes -->
    <circle cx="0" cy="-64" r="5" fill="#C9D1D9"/>
    <circle cx="55" cy="-32" r="5" fill="#C9D1D9"/>
    <circle cx="55" cy="32" r="5" fill="#C9D1D9"/>
    <circle cx="0" cy="64" r="5" fill="#C9D1D9"/>
    <circle cx="-55" cy="32" r="5" fill="#C9D1D9"/>
    <circle cx="-55" cy="-32" r="5" fill="#C9D1D9"/>
  </g>
</svg>
