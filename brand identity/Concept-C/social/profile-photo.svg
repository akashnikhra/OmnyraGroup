<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48E0FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B0F1A;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- EMBLEM centered and scaled -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#cyanGlowGrad)" stroke-width="3.5" filter="url(#glow)" opacity="0.8"/>
    <g filter="url(#softGlow)" opacity="0.6">
      <line x1="0" y1="-110" x2="0" y2="-64" stroke="#00D4FF" stroke-width="2.5"/>
      <line x1="95" y1="-55" x2="55" y2="-32" stroke="#00D4FF" stroke-width="2.5"/>
      <line x1="95" y1="55" x2="55" y2="32" stroke="#00D4FF" stroke-width="2.5"/>
      <line x1="0" y1="110" x2="0" y2="64" stroke="#00D4FF" stroke-width="2.5"/>
      <line x1="-95" y1="55" x2="-55" y2="32" stroke="#00D4FF" stroke-width="2.5"/>
      <line x1="-95" y1="-55" x2="-55" y2="-32" stroke="#00D4FF" stroke-width="2.5"/>
    </g>
    <circle cx="0" cy="0" r="84" fill="#00D4FF" opacity="0.15"/>
    <circle cx="0" cy="0" r="62" fill="#0B0F1A" opacity="0.8"/>
    <g filter="url(#softGlow)" opacity="0.3">
      <line x1="-48" y1="-24" x2="48" y2="-24" stroke="#00D4FF" stroke-width="1.2"/>
      <line x1="-48" y1="0" x2="48" y2="0" stroke="#00D4FF" stroke-width="1.2"/>
      <line x1="-48" y1="24" x2="48" y2="24" stroke="#00D4FF" stroke-width="1.2"/>
      <line x1="-24" y1="-48" x2="-24" y2="48" stroke="#00D4FF" stroke-width="1.2"/>
      <line x1="0" y1="-48" x2="0" y2="48" stroke="#00D4FF" stroke-width="1.2"/>
      <line x1="24" y1="-48" x2="24" y2="48" stroke="#00D4FF" stroke-width="1.2"/>
    </g>
    <g filter="url(#glow)">
      <path d="M -26,26 L 32,-32" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>
      <polygon points="32,-32 14,-32 32,-14" fill="white"/>
    </g>
    <circle cx="0" cy="-110" r="7" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="95" cy="-55" r="6" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="95" cy="55" r="6" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="0" cy="110" r="7" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="-95" cy="55" r="6" fill="#FF9F43" filter="url(#softGlow)"/>
    <circle cx="-95" cy="-55" r="6" fill="#FF9F43" filter="url(#softGlow)"/>
  </g>
</svg>
