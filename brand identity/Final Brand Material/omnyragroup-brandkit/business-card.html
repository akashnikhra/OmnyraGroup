<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNyra Group - Business Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        .card-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8B949E;
            margin-bottom: -40px;
        }

        .business-card {
            width: 3.5in;
            height: 2in;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        /* FRONT SIDE */
        .card-front {
            background: linear-gradient(135deg, #0D1117 0%, #161B22 100%);
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .front-logo {
            width: 140px;
            height: auto;
            position: relative;
            z-index: 2;
        }

        .front-watermark {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            opacity: 0.15;
            filter: brightness(0) saturate(100%) invert(47%) sepia(50%) saturate(1000%) hue-rotate(175deg) brightness(95%) contrast(90%);
        }

        .person-info {
            margin-top: auto;
            position: relative;
            z-index: 2;
        }

        .person-name {
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .person-title {
            color: #00A8E8;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        /* BACK SIDE */
        .card-back {
            background: #FFFFFF;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .back-logo-section {
            display: flex;
            justify-content: center;
        }

        .back-logo {
            width: 160px;
            height: auto;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-left: 4px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 8.5px;
            color: #161B22;
        }

        .contact-item svg {
            width: 12px;
            height: 12px;
            fill: #00A8E8;
            flex-shrink: 0;
        }

        .back-tagline {
            font-size: 6.5px;
            color: #8B949E;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            margin-top: 8px;
        }

        .accent-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00A8E8 0%, #0077B6 100%);
        }

        .hex-watermark {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            opacity: 0.06;
        }
    </style>
</head>
<body>
    <p class="card-label">Front Side</p>
    <div class="business-card card-front">
        <img src="icon-only-transparent.png" alt="OMNyra Watermark" class="front-watermark">
        <img src="Monochrome_white-transparent.png" alt="OMNyra Group" class="front-logo">

        <div class="person-info">
            <div class="person-name">Your Name</div>
            <div class="person-title">Your Title</div>
        </div>
    </div>

    <p class="card-label">Back Side</p>
    <div class="business-card card-back">
        <img src="icon-only-transparent.png" alt="OMNyra Watermark" class="hex-watermark">

        <div class="back-logo-section">
            <img src="primary-logo-transparent.png" alt="OMNyra Group" class="back-logo">
        </div>

        <div class="contact-details">
            <div class="contact-item">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <span>omnyra.training@gmail.com</span>
            </div>
            <div class="contact-item">
                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                <span>+91 9063370816</span>
            </div>
            <div class="contact-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span>Global | US & UK</span>
            </div>
            <div class="contact-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <span>omnyragroup.online</span>
            </div>
        </div>

        <div class="back-tagline">Empowering Careers. Securing the Future.</div>
        <div class="accent-bar"></div>
    </div>
</body>
</html>
